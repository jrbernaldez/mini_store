.lbox{background:var(--card);color:var(--ink);padding:22px;border-radius:14px;width:min(380px,100%)}.lbox h1{margin:0 0 4px}.lbox label{display:block;margin:10px 0 4px;color:var(--mute);font-size:14px}.lbox a{color:var(--g)}
body.locked main,body.locked nav,body.locked header .hr{display:none}#alert{background:#ffc233;color:#2b2100;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600;cursor:pointer}#alert[hidden]{display:none}body:not(.t-sell) #alert{display:none}.row{flex-wrap:wrap}.row .btn{padding:6px 10px}.chips .btn{padding:6px 14px}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left;white-space:normal}th{color:var(--mute);font-weight:600;font-size:13px}:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding-left:220px;transition:padding .2s;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:0}
header{background:#0c2233;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
